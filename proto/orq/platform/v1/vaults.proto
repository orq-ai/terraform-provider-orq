syntax = "proto3";

package orq.platform.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "openapiv3/annotations.proto";
import "orq/authz/v1/authz.proto";

option (openapi.v3.document) = {
  tags: [
    {
      name: "Vaults"
      description: "Named collections of secrets. Admins share a vault with factories; factories attach vaults to expose their secrets as environment variables to work items."
    }
  ]
};

// A vault is either owned by one factory or shared by the workspace with all
// or selected factories; the scope is immutable. Secrets live in
// secrets.proto and are managed through SecretsService.
service VaultsService {
  rpc CreateVault(CreateVaultRequest) returns (CreateVaultResponse) {
    option (orq.authz.v1.authz) = {
      verb: "vault.create"
      scope: AUTHZ_SCOPE_WORKSPACE
    };
    option (google.api.http) = {
      post: "/v2/vaults"
      body: "*"
    };
    option (openapi.v3.operation) = {
      summary: "Create a vault"
      description: "Creates a vault owned by one factory or shared by the workspace. Factory-owned vaults need write access to that factory; workspace vaults need workspace-wide access."
      operation_id: "VaultCreate"
      tags: ["Vaults", "private"]
      specification_extension: [
        {name: "x-speakeasy-group" value: {yaml: "vaults"}},
        {name: "x-speakeasy-name-override" value: {yaml: "create"}},
        {name: "x-cli-hidden" value: {yaml: "true"}},
        {name: "x-speakeasy-ignore" value: {yaml: "true"}}
      ]
    };
  }

  rpc ListVaults(ListVaultsRequest) returns (ListVaultsResponse) {
    option (orq.authz.v1.authz) = {
      verb: "vault.list"
      scope: AUTHZ_SCOPE_WORKSPACE
    };
    option (google.api.http) = {get: "/v2/vaults"};
    option (openapi.v3.operation) = {
      summary: "List vaults"
      description: "Returns the vaults the caller can reach, optionally narrowed to the vaults one factory may attach."
      operation_id: "VaultList"
      tags: ["Vaults", "private"]
      specification_extension: [
        {name: "x-speakeasy-group" value: {yaml: "vaults"}},
        {name: "x-speakeasy-name-override" value: {yaml: "list"}},
        {name: "x-cli-hidden" value: {yaml: "true"}},
        {name: "x-speakeasy-ignore" value: {yaml: "true"}}
      ]
    };
  }

  rpc GetVault(GetVaultRequest) returns (GetVaultResponse) {
    option (orq.authz.v1.authz) = {
      verb: "vault.view"
      scope: AUTHZ_SCOPE_WORKSPACE
    };
    option (google.api.http) = {get: "/v2/vaults/{vault_id}"};
    option (openapi.v3.operation) = {
      summary: "Get a vault"
      description: "Retrieves a vault by ID. Vaults outside the caller's reach return NOT_FOUND."
      operation_id: "VaultGet"
      tags: ["Vaults", "private"]
      specification_extension: [
        {name: "x-speakeasy-group" value: {yaml: "vaults"}},
        {name: "x-speakeasy-name-override" value: {yaml: "get"}},
        {name: "x-cli-hidden" value: {yaml: "true"}},
        {name: "x-speakeasy-ignore" value: {yaml: "true"}}
      ]
    };
  }

  rpc UpdateVault(UpdateVaultRequest) returns (UpdateVaultResponse) {
    option (orq.authz.v1.authz) = {
      verb: "vault.update"
      scope: AUTHZ_SCOPE_WORKSPACE
    };
    option (google.api.http) = {
      patch: "/v2/vaults/{vault_id}"
      body: "*"
    };
    option (openapi.v3.operation) = {
      summary: "Update a vault"
      description: "Updates the display name, description or sharing of a vault. Removing a factory from the sharing while it still has the vault attached fails with FAILED_PRECONDITION."
      operation_id: "VaultUpdate"
      tags: ["Vaults", "private"]
      specification_extension: [
        {name: "x-speakeasy-group" value: {yaml: "vaults"}},
        {name: "x-speakeasy-name-override" value: {yaml: "update"}},
        {name: "x-cli-hidden" value: {yaml: "true"}},
        {name: "x-speakeasy-ignore" value: {yaml: "true"}}
      ]
    };
  }

  rpc DeleteVault(DeleteVaultRequest) returns (DeleteVaultResponse) {
    option (orq.authz.v1.authz) = {
      verb: "vault.delete"
      scope: AUTHZ_SCOPE_WORKSPACE
    };
    option (google.api.http) = {delete: "/v2/vaults/{vault_id}"};
    option (openapi.v3.operation) = {
      summary: "Delete a vault"
      description: "Deletes a vault and all its secrets. Fails with FAILED_PRECONDITION while any factory still has the vault attached."
      operation_id: "VaultDelete"
      tags: ["Vaults", "private"]
      specification_extension: [
        {name: "x-speakeasy-group" value: {yaml: "vaults"}},
        {name: "x-speakeasy-name-override" value: {yaml: "delete"}},
        {name: "x-cli-hidden" value: {yaml: "true"}},
        {name: "x-speakeasy-ignore" value: {yaml: "true"}}
      ]
    };
  }
}

// Which factories may attach a workspace vault.
message VaultSharing {
  oneof mode {
    option (buf.validate.oneof).required = true;

    VaultSharingAllFactories all_factories = 1;
    VaultSharingSelectedFactories selected = 2;
  }
}

message VaultSharingAllFactories {}

message VaultSharingSelectedFactories {
  // Factories allowed to attach the vault. An empty list shares it with no factory.
  repeated string factory_ids = 1 [(buf.validate.field).repeated = {
    max_items: 100
    unique: true
    items: {
      string: {
        min_len: 1
        max_len: 64
      }
    }
  }];
}

// Vault IDs restricting which attached vaults a work item receives. Absent
// means every vault attached to the factory; an empty list means none.
message VaultIdList {
  repeated string ids = 1 [(buf.validate.field).repeated = {
    max_items: 20
    unique: true
    items: {
      string: {
        min_len: 1
        max_len: 64
      }
    }
  }];
}

message Vault {
  option (openapi.v3.schema) = {
    required: [
      "id",
      "workspace_id",
      "display_name",
      "secret_count",
      "created_by_id",
      "created",
      "updated"
    ]
  };

  string id = 1 [
    json_name = "_id",
    (openapi.v3.property) = {example: {yaml: "vault_01K8EXAMPLEVAULT000000000"}}
  ];
  string workspace_id = 2 [(openapi.v3.property) = {
    specification_extension: [
      {name: "x-orq-hidden" value: {yaml: "true"}},
      {name: "x-speakeasy-ignore" value: {yaml: "true"}}
    ]
  }];
  string display_name = 3;
  string description = 4;
  // Exactly one is set and it never changes after creation.
  oneof scope {
    // Owned by this factory; only that factory can attach it.
    string factory_id = 5;
    // Owned by the workspace; shared with all or selected factories.
    VaultSharing sharing = 6;
  }
  int32 secret_count = 7;
  string created_by_id = 8;
  google.protobuf.Timestamp created = 9;
  google.protobuf.Timestamp updated = 10;
}

message CreateVaultRequest {
  option (openapi.v3.schema) = {
    required: ["display_name"]
    example: {yaml: "{\"display_name\":\"Staging credentials\",\"description\":\"Third-party keys for the staging stack.\",\"sharing\":{\"selected\":{\"factory_ids\":[\"fac_01K8EXAMPLEFACTORY0000000\"]}}}"}
  };

  string display_name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 100
  }];
  string description = 2 [(buf.validate.field).string.max_len = 2000];
  // Omitting both creates a workspace vault shared with all factories.
  oneof scope {
    string factory_id = 3 [(buf.validate.field).string = {
      min_len: 1
      max_len: 64
    }];
    VaultSharing sharing = 4;
  }
}

message CreateVaultResponse {
  Vault vault = 1;
}

message ListVaultsRequest {
  // Page size between 1 and 200. Defaults to 25.
  optional int32 limit = 1 [(buf.validate.field).int32 = {
    gte: 1
    lte: 200
  }];
  // Cursor for the page after the given vault id.
  string starting_after = 2 [(buf.validate.field).string.max_len = 64];
  // Only vaults this factory may attach: its own plus workspace vaults shared with it.
  string factory_id = 3 [(buf.validate.field).string.max_len = 64];
  // Case-insensitive match against the display name.
  string search = 4 [(buf.validate.field).string.max_len = 255];
}

message ListVaultsResponse {
  // Always "list".
  string object = 1;
  repeated Vault data = 2;
  bool has_more = 3;
}

message GetVaultRequest {
  string vault_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
}

message GetVaultResponse {
  Vault vault = 1;
}

message UpdateVaultRequest {
  option (openapi.v3.schema) = {
    required: ["vault_id"]
  };

  string vault_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  optional string display_name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 100
  }];
  optional string description = 3 [(buf.validate.field).string.max_len = 2000];
  // Rejected with INVALID_ARGUMENT on a factory-owned vault: the scope is immutable.
  optional VaultSharing sharing = 4;
}

message UpdateVaultResponse {
  Vault vault = 1;
}

message DeleteVaultRequest {
  string vault_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
}

// The response body is empty when the delete succeeds.
message DeleteVaultResponse {}
