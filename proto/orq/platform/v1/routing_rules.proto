syntax = "proto3";

package orq.platform.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "openapiv3/annotations.proto";
import "orq/authz/v1/authz.proto";

option (openapi.v3.document) = {
  tags: [
    {
      name: "Routing Rules"
      description: "Routing Rules conditionally select models and enforce request plugins for AI Gateway traffic. Rules are evaluated by ascending priority and may be scoped to a project or the whole workspace."
    }
  ]
};

service RoutingRulesService {
  rpc CreateRoutingRule(CreateRoutingRuleRequest) returns (CreateRoutingRuleResponse) {
    option (orq.authz.v1.authz) = {
      verb: "routing-rule.create"
      scope: AUTHZ_SCOPE_PROJECT
      project_id_field: "project_id"
    };
    option (google.api.http) = {
      post: "/v2/routing-rules"
      body: "*"
      response_body: "routing_rule"
    };
    option (openapi.v3.operation) = {
      summary: "Create a routing rule"
      description: "Creates a routing rule with metadata and optional model, plugin, priority, and matching configuration. Rules default to disabled when `enabled` is omitted."
      operation_id: "RoutingRuleCreate"
      tags: ["Routing Rules"]
      specification_extension: [
        {
          name: "x-speakeasy-group"
          value: {yaml: "routingRules"}
        },
        {
          name: "x-speakeasy-name-override"
          value: {yaml: "create"}
        },
        {
          name: "x-cli-hidden"
          value: {yaml: "true"}
        },
        {
          name: "x-cli-group"
          value: {yaml: "routingRules"}
        },
        {
          name: "x-cli-name"
          value: {yaml: "create"}
        }
      ]
    };
  }

  rpc ListRoutingRules(ListRoutingRulesRequest) returns (ListRoutingRulesResponse) {
    option (orq.authz.v1.authz) = {
      verb: "routing-rule.list"
      scope: AUTHZ_SCOPE_PROJECT
      project_id_field: "project_id"
    };
    option (google.api.http) = {get: "/v2/routing-rules"};
    option (openapi.v3.operation) = {
      summary: "List routing rules"
      description: "Returns routing rules ordered by ascending priority. Supports cursor pagination, search, status, project, and referenced-model filters."
      operation_id: "RoutingRuleList"
      tags: ["Routing Rules"]
      specification_extension: [
        {
          name: "x-speakeasy-group"
          value: {yaml: "routingRules"}
        },
        {
          name: "x-speakeasy-name-override"
          value: {yaml: "list"}
        },
        {
          name: "x-cli-hidden"
          value: {yaml: "true"}
        },
        {
          name: "x-cli-group"
          value: {yaml: "routingRules"}
        },
        {
          name: "x-cli-name"
          value: {yaml: "list"}
        }
      ]
    };
  }

  rpc ListRoutingRuleUsedModels(ListRoutingRuleUsedModelsRequest) returns (ListRoutingRuleUsedModelsResponse) {
    option (orq.authz.v1.authz) = {
      verb: "routing-rule.list"
      scope: AUTHZ_SCOPE_PROJECT
      project_id_field: "project_id"
    };
    option (google.api.http) = {get: "/v2/routing-rules/used-models"};
    option (openapi.v3.operation) = {
      summary: "List models used by routing rules"
      description: "Returns the distinct model references used by routing rules in the requested scope."
      operation_id: "RoutingRuleListUsedModels"
      tags: ["Routing Rules"]
      specification_extension: [
        {
          name: "x-speakeasy-group"
          value: {yaml: "routingRules"}
        },
        {
          name: "x-speakeasy-name-override"
          value: {yaml: "listUsedModels"}
        },
        {
          name: "x-cli-hidden"
          value: {yaml: "true"}
        },
        {
          name: "x-cli-group"
          value: {yaml: "routingRules"}
        },
        {
          name: "x-cli-name"
          value: {yaml: "listUsedModels"}
        }
      ]
    };
  }

  rpc GetRoutingRule(GetRoutingRuleRequest) returns (GetRoutingRuleResponse) {
    option (orq.authz.v1.authz) = {
      verb: "routing-rule.view"
      scope: AUTHZ_SCOPE_PROJECT
    };
    option (google.api.http) = {
      get: "/v2/routing-rules/{routing_rule_id}"
      response_body: "routing_rule"
    };
    option (openapi.v3.operation) = {
      summary: "Retrieve a routing rule"
      description: "Retrieves a routing rule by its unique identifier."
      operation_id: "RoutingRuleGet"
      tags: ["Routing Rules"]
      specification_extension: [
        {
          name: "x-speakeasy-group"
          value: {yaml: "routingRules"}
        },
        {
          name: "x-speakeasy-name-override"
          value: {yaml: "retrieve"}
        },
        {
          name: "x-cli-hidden"
          value: {yaml: "true"}
        },
        {
          name: "x-cli-group"
          value: {yaml: "routingRules"}
        },
        {
          name: "x-cli-name"
          value: {yaml: "retrieve"}
        }
      ]
    };
  }

  rpc UpdateRoutingRule(UpdateRoutingRuleRequest) returns (UpdateRoutingRuleResponse) {
    option (orq.authz.v1.authz) = {
      verb: "routing-rule.update"
      scope: AUTHZ_SCOPE_PROJECT
    };
    option (google.api.http) = {
      patch: "/v2/routing-rules/{routing_rule_id}"
      body: "*"
      response_body: "routing_rule"
    };
    option (openapi.v3.operation) = {
      summary: "Update a routing rule"
      description: "Partially updates routing-rule metadata or configuration. Project scope is immutable."
      operation_id: "RoutingRuleUpdate"
      tags: ["Routing Rules"]
      specification_extension: [
        {
          name: "x-speakeasy-group"
          value: {yaml: "routingRules"}
        },
        {
          name: "x-speakeasy-name-override"
          value: {yaml: "update"}
        },
        {
          name: "x-cli-hidden"
          value: {yaml: "true"}
        },
        {
          name: "x-cli-group"
          value: {yaml: "routingRules"}
        },
        {
          name: "x-cli-name"
          value: {yaml: "update"}
        }
      ]
    };
  }

  rpc DeleteRoutingRule(DeleteRoutingRuleRequest) returns (DeleteRoutingRuleResponse) {
    option (orq.authz.v1.authz) = {
      verb: "routing-rule.delete"
      scope: AUTHZ_SCOPE_PROJECT
    };
    option (google.api.http) = {delete: "/v2/routing-rules/{routing_rule_id}"};
    option (openapi.v3.operation) = {
      summary: "Delete a routing rule"
      description: "Permanently deletes a routing rule."
      operation_id: "RoutingRuleDelete"
      tags: ["Routing Rules"]
      specification_extension: [
        {
          name: "x-speakeasy-group"
          value: {yaml: "routingRules"}
        },
        {
          name: "x-speakeasy-name-override"
          value: {yaml: "delete"}
        },
        {
          name: "x-cli-hidden"
          value: {yaml: "true"}
        },
        {
          name: "x-cli-group"
          value: {yaml: "routingRules"}
        },
        {
          name: "x-cli-name"
          value: {yaml: "delete"}
        }
      ]
    };
  }
}

message RoutingRule {
  option (openapi.v3.schema) = {
    required: [
      "id",
      "created_at",
      "updated_at",
      "created_by_id",
      "updated_by_id",
      "project_id",
      "display_name",
      "description",
      "enabled",
      "plugins",
      "priority"
    ]
  };

  string id = 1 [json_name = "_id"];
  google.protobuf.Timestamp created_at = 2;
  google.protobuf.Timestamp updated_at = 3;
  string created_by_id = 4;
  string updated_by_id = 5;
  string project_id = 6 [(openapi.v3.property) = {description: "Project that contains the rule. Empty for workspace-wide rules."}];
  string display_name = 7 [(openapi.v3.property) = {description: "Human-readable routing-rule name."}];
  string description = 8;
  bool enabled = 9;
  RoutingRuleExpression expression = 10;
  RoutingRuleModelsConfig models_config = 11;
  repeated RoutingRulePlugin plugins = 12;
  int32 priority = 13 [(openapi.v3.property) = {description: "Evaluation order. Lower values are evaluated first."}];
  RoutingRuleCacheConfig cache_config = 14 [(openapi.v3.property) = {description: "Exact-match response cache configuration. Omit to disable caching."}];
}

message RoutingRuleExpression {
  google.protobuf.Struct config = 1;
  string cel = 2 [
    (buf.validate.field).string.max_len = 2000,
    (openapi.v3.property) = {description: "CEL expression used to match requests. Empty means the rule always matches."}
  ];
}

message RoutingRuleModelsConfig {
  option (buf.validate.message).cel = {
    id: "fallback_on_codes_mode"
    message: "fallback_on_codes is only allowed in fallback mode"
    expression: "this.fallback_on_codes.size() == 0 || this.mode == 'fallback'"
  };
  string mode = 1 [
    (buf.validate.field).string = {
      in: [
        "fallback",
        "latency_based",
        "weighted",
        "round_robin"
      ]
    },
    (openapi.v3.property) = {description: "Load-balancing mode."}
  ];
  repeated RoutingRuleModel models = 2 [(buf.validate.field).repeated.min_items = 1];
  repeated int32 fallback_on_codes = 3 [
    (buf.validate.field).repeated = {
      max_items: 20
      unique: true
      items: {int32: {gte: 400 lte: 599}}
    },
    (openapi.v3.property) = {
      description: "HTTP error status codes that trigger fallback. Only allowed in fallback mode. Empty uses the default: 408, 429, 500, 502, 503, 504, 529."
      max_items: 20
      unique_items: true
      items: {schema_or_reference: {schema: {type: "integer" format: "int32" minimum: 400 maximum: 599}}}
    }
  ];
}

message RoutingRuleModel {
  string model = 1 [(buf.validate.field).string.min_len = 1];
  string display_name = 2;
  optional double weight = 3 [(buf.validate.field).double = {
    gte: 0
    lte: 1
  }];
  string integration_id = 4;
}

message RoutingRuleCacheConfig {
  option (openapi.v3.schema) = {
    required: ["ttl"]
  };

  int32 ttl = 1 [
    (buf.validate.field).int32 = {
      gte: 1
      lte: 259200
    },
    (openapi.v3.property) = {description: "Cache time to live in seconds. Maximum 259200 seconds (3 days)."}
  ];
}

message RoutingRulePlugin {
  string id = 1 [
    (buf.validate.field).string = {
      in: [
        "pii_redaction",
        "response_healing",
        "response-healing",
        "trace_scrubbing",
        "signals"
      ]
    },
    (openapi.v3.property) = {description: "Plugin discriminator."}
  ];
  // Languages, regions and entity types are checked against the live
  // pii-detection capabilities catalog when the rule is saved, not pinned
  // here, so a language or region the detector gains becomes writable without
  // a future update.
  optional string language = 2;
  repeated string entities = 3 [(openapi.v3.property) = {description: "Entity types to redact. On their own a strict allowlist; alongside regions they add to the region coverage."}];
  optional string on_failure = 4 [(buf.validate.field).string = {
    in: [
      "",
      "block",
      "passthrough"
    ]
  }];
  optional double threshold = 5 [(buf.validate.field).double = {
    gte: 0
    lte: 1
  }];
  repeated string mask = 6;
  repeated string regions = 7 [(openapi.v3.property) = {description: "Regions of coverage by ISO 3166-1 alpha-2 code, or [\"all\"]. Combines with entities: the two selections are unioned."}];
  map<string, double> entity_thresholds = 8 [
    (buf.validate.field).map.values.double = {
      gte: 0
      lte: 1
    },
    (openapi.v3.property) = {description: "Per-entity-type confidence cutoff. Every key must also appear in entities."}
  ];
  RoutingRuleModelsConfig models_config = 9;
  map<string, SignalsCheck> checks = 12;
}

message SignalsCheck {
  bool enabled = 1;
  optional double threshold = 2;
}

message CreateRoutingRuleRequest {
  option (openapi.v3.schema) = {
    required: ["display_name"]
  };

  string display_name = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 256
  ];
  optional string description = 2 [(buf.validate.field).string.max_len = 2048];
  optional string project_id = 3 [(openapi.v3.property) = {description: "Optional project scope. Omit for a workspace-wide rule."}];
  optional bool enabled = 4 [(openapi.v3.property) = {description: "Whether the rule is active. Defaults to false when omitted."}];
  RoutingRuleExpression expression = 5;
  RoutingRuleModelsConfig models_config = 6;
  repeated RoutingRulePlugin plugins = 7;
  optional int32 priority = 8 [(buf.validate.field).int32.gte = 0];
  RoutingRuleCacheConfig cache_config = 9;
}

message CreateRoutingRuleResponse {
  option (openapi.v3.schema) = {
    required: ["routing_rule"]
  };
  RoutingRule routing_rule = 1;
}

message ListRoutingRulesRequest {
  optional int32 limit = 1 [
    (buf.validate.field).int32.gte = 1,
    (buf.validate.field).int32.lte = 200
  ];
  string starting_after = 2;
  string ending_before = 3;
  string project_id = 4;
  optional string search = 5;
  optional bool enabled = 6;
  repeated string model = 7;
}

message ListRoutingRulesResponse {
  option (openapi.v3.schema) = {
    required: [
      "object",
      "data",
      "has_more"
    ]
  };

  string object = 1;
  repeated RoutingRule data = 2;
  bool has_more = 3;
}

message ListRoutingRuleUsedModelsRequest {
  string project_id = 1;
}

message ListRoutingRuleUsedModelsResponse {
  option (openapi.v3.schema) = {
    required: [
      "object",
      "models"
    ]
  };

  string object = 1;
  repeated string models = 2;
}

message GetRoutingRuleRequest {
  option (openapi.v3.schema) = {
    required: ["routing_rule_id"]
  };
  string routing_rule_id = 1 [(buf.validate.field).string.min_len = 1];
}

message GetRoutingRuleResponse {
  option (openapi.v3.schema) = {
    required: ["routing_rule"]
  };
  RoutingRule routing_rule = 1;
}

message UpdateRoutingRuleRequest {
  option (openapi.v3.schema) = {
    required: ["routing_rule_id"]
  };

  string routing_rule_id = 1 [(buf.validate.field).string.min_len = 1];
  optional string display_name = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 256
  ];
  optional string description = 3 [(buf.validate.field).string.max_len = 2048];
  optional bool enabled = 4;
  RoutingRuleExpression expression = 5;
  RoutingRuleModelsConfig models_config = 6;
  repeated RoutingRulePlugin plugins = 7;
  optional int32 priority = 8 [(buf.validate.field).int32.gte = 0];

  // Connect clients set this when replacing plugins, including with an empty
  // list. It is hidden from the public REST/SDK surface, where an explicit
  // `plugins: []` remains the compatibility signal for clearing plugins.
  optional bool replace_plugins = 9 [(openapi.v3.property) = {
    specification_extension: [
      {
        name: "x-orq-hidden"
        value: {yaml: "true"}
      },
      {
        name: "x-speakeasy-ignore"
        value: {yaml: "true"}
      }
    ]
  }];

  // Connect clients set this to remove an existing model configuration.
  optional bool clear_models_config = 10 [(openapi.v3.property) = {
    specification_extension: [
      {
        name: "x-orq-hidden"
        value: {yaml: "true"}
      },
      {
        name: "x-speakeasy-ignore"
        value: {yaml: "true"}
      }
    ]
  }];

  RoutingRuleCacheConfig cache_config = 11;

  // Connect clients set this to disable an existing routing-rule cache.
  optional bool clear_cache_config = 12 [(openapi.v3.property) = {
    specification_extension: [
      {
        name: "x-orq-hidden"
        value: {yaml: "true"}
      },
      {
        name: "x-speakeasy-ignore"
        value: {yaml: "true"}
      }
    ]
  }];
}

message UpdateRoutingRuleResponse {
  option (openapi.v3.schema) = {
    required: ["routing_rule"]
  };
  RoutingRule routing_rule = 1;
}

message DeleteRoutingRuleRequest {
  option (openapi.v3.schema) = {
    required: ["routing_rule_id"]
  };
  string routing_rule_id = 1 [(buf.validate.field).string.min_len = 1];
}

message DeleteRoutingRuleResponse {}
