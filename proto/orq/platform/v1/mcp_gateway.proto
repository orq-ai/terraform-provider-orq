// ============================================================================
// Enums
// ============================================================================

// Transport used to reach an upstream MCP server.
enum McpConnectionType {
  MCP_CONNECTION_TYPE_UNSPECIFIED = 0;
  MCP_CONNECTION_TYPE_HTTP = 1;
  MCP_CONNECTION_TYPE_SSE = 2;
  // Not supported by these endpoints; use HTTP or SSE.
  MCP_CONNECTION_TYPE_STDIO = 3;
  // Tools are operations of an OpenAPI document; `url` is the API base URL.
  MCP_CONNECTION_TYPE_OPENAPI = 4;
}

// Credential scheme the gateway presents to an upstream MCP server.
enum McpAuthType {
  MCP_AUTH_TYPE_UNSPECIFIED = 0;
  MCP_AUTH_TYPE_NONE = 1;
  MCP_AUTH_TYPE_STATIC_HEADERS = 2;
  MCP_AUTH_TYPE_OAUTH_CLIENT_CREDENTIALS = 3;
  // Each user authorizes the upstream with authorization code and PKCE.
  MCP_AUTH_TYPE_PER_USER_OAUTH = 4;
  // Enterprise-managed authorization: the gateway redeems an ID-JAG issued by the workspace's SSO identity provider for the signed-in user.
  MCP_AUTH_TYPE_ENTERPRISE_MANAGED = 5;
}

// How much of a server's tool catalog a gateway exposes.
enum McpToolExposureMode {
  MCP_TOOL_EXPOSURE_MODE_UNSPECIFIED = 0;
  MCP_TOOL_EXPOSURE_MODE_ALL = 1;
  MCP_TOOL_EXPOSURE_MODE_SELECTED = 2;
  MCP_TOOL_EXPOSURE_MODE_NONE = 3;
}

// How upstream tool names are namespaced before MCP clients see them.
enum McpToolNaming {
  MCP_TOOL_NAMING_UNSPECIFIED = 0;
  // Always prefixes exposed names with `{server_key}__`.
  MCP_TOOL_NAMING_PREFIX_WITH_SERVER_KEY = 1;
  // Prefixes only the names duplicated across linked servers.
  MCP_TOOL_NAMING_PREFIX_ON_COLLISION = 2;
}

// How the gateway presents its tools to MCP clients. CODE exposes a compact
// discovery-and-execution surface; DIRECT exposes each upstream tool directly.
enum McpGatewayMode {
  MCP_GATEWAY_MODE_UNSPECIFIED = 0;
  MCP_GATEWAY_MODE_CODE = 1;
  MCP_GATEWAY_MODE_DIRECT = 2;
}

// ============================================================================
// Shared messages
// ============================================================================

message McpConnection {
  option (openapi.v3.schema) = {
    required: [
      "type",
      "url"
    ]
  };

  // Transport the gateway uses to dial the upstream server.
  McpConnectionType type = 1;
  // Upstream endpoint; must use the http or https scheme.
  string url = 2 [(buf.validate.field).string.uri = true];
}

message McpHeaderSecret {
  // Header name sent to the upstream server.
  string key = 1;
  // Header value; accepted on write and never returned.
  string value = 2 [(openapi.v3.property) = {write_only: true}];
  // Redacted preview of `value`, returned in its place.
  string masked_value = 3;
}

// McpOAuthConfig is the OAuth client orq presents to the upstream authorization
// server for OAUTH_CLIENT_CREDENTIALS, PER_USER_OAUTH and ENTERPRISE_MANAGED.
message McpOAuthConfig {
  // OAuth client identifier presented to the upstream authorization server.
  string client_id = 1;
  // OAuth client secret; accepted on write and never returned.
  string client_secret = 2 [(openapi.v3.property) = {write_only: true}];
  // Token endpoint for OAUTH_CLIENT_CREDENTIALS; PER_USER_OAUTH and ENTERPRISE_MANAGED discover it from `resource`.
  string token_url = 3 [(buf.validate.field) = {string: {uri: true} ignore: IGNORE_IF_ZERO_VALUE}];
  // Scopes requested when minting upstream access tokens.
  repeated string scopes = 4;
  // Redacted preview of `client_secret`, returned in its place.
  string masked_value = 5;
  // Exact authorization-server issuer; pins discovery for PER_USER_OAUTH and ENTERPRISE_MANAGED.
  string issuer = 6;
  // Protected resource identifier; defaults to the upstream connection URL.
  string resource = 7;
}

// McpEnterpriseAuthConfig is superseded by McpOAuthConfig: ENTERPRISE_MANAGED servers
// read and write `oauth`. It is still accepted on write and mirrored on read.
message McpEnterpriseAuthConfig {
  option (openapi.v3.schema) = {deprecated: true};

  // RFC 9728 resource identifier the tokens are bound to; defaults to the connection URL.
  string resource = 1;
  // OAuth client identifier registered at the upstream authorization server.
  string client_id = 2;
  // OAuth client secret; accepted on write and never returned.
  string client_secret = 3 [(openapi.v3.property) = {write_only: true}];
  // Redacted preview of `client_secret`, returned in its place.
  string masked_value = 4;
  // Scopes requested when redeeming the identity assertion grant.
  repeated string scopes = 5;
}

message McpAuthConfig {
  option (openapi.v3.schema) = {
    required: ["type"]
  };

  // Credential scheme used to authenticate to this upstream server.
  McpAuthType type = 1;
  // Headers sent upstream on every request; at least one entry when type is STATIC_HEADERS.
  repeated McpHeaderSecret static_headers = 2;
  // OAuth client for the upstream authorization server; set when type is OAUTH_CLIENT_CREDENTIALS, PER_USER_OAUTH or ENTERPRISE_MANAGED.
  McpOAuthConfig oauth = 3;
  // Superseded by `oauth` for ENTERPRISE_MANAGED; accepted on write and mirrored on read.
  McpEnterpriseAuthConfig enterprise = 4 [(openapi.v3.property) = {deprecated: true}];
}

message McpToolExposure {
  option (openapi.v3.schema) = {
    required: ["mode"]
  };

  // Selection strategy: ALL, SELECTED or NONE.
  McpToolExposureMode mode = 1;
  // Keeps only the tools the upstream annotates as read-only.
  bool read_only = 2;
  // `McpTool.id` values to expose when mode is SELECTED; a tool renamed upstream gets a new id on the next sync.
  repeated string tool_ids = 3;
  // `McpTool.id` values deliberately left unexposed when mode is SELECTED; an active tool in neither list is new to this selection.
  repeated string excluded_tool_ids = 4;
}

message McpSkillExposure {
  option (openapi.v3.schema) = {
    required: ["mode"]
  };

  // Selection strategy: ALL, SELECTED or NONE. An unset exposure exposes no skills.
  McpToolExposureMode mode = 1;
  // `McpSkill.uri` values to expose when mode is SELECTED.
  repeated string skill_uris = 2;
}

message McpResourceExposure {
  option (openapi.v3.schema) = {
    required: ["mode"]
  };

  // ALL exposes all current and future resources and templates. SELECTED exposes only the listed IDs. NONE exposes neither.
  McpToolExposureMode mode = 1;
  // `McpResource.selection_id` values to expose when mode is SELECTED.
  repeated string resource_ids = 2;
  // `McpResourceTemplate.selection_id` values to expose when mode is SELECTED.
  repeated string resource_template_ids = 3;
}

// A file of an upstream skill, as listed in the skill's manifest.
message McpSkillFile {
  // Resource URI of the file on the upstream server.
  string uri = 1;
  // SHA-256 digest of the file's raw bytes, formatted as `sha256:{hex}`.
  string digest = 2;
  // Length in bytes of the file's raw content.
  int64 size = 3;
}

// A skill an upstream server publishes through the MCP Skills extension (`io.modelcontextprotocol/skills`).
message McpSkill {
  // Resource URI of the skill's `SKILL.md` on the upstream server.
  string uri = 1;
  // Skill name from the `SKILL.md` frontmatter.
  string name = 2;
  // Skill description from the `SKILL.md` frontmatter.
  string description = 3;
  // Full `SKILL.md` frontmatter as published upstream.
  google.protobuf.Struct frontmatter = 4;
  // Manifest of the skill's files; empty when the skill is dynamic.
  repeated McpSkillFile files = 5;
  // Upstream generates the skill's content and publishes no manifest.
  bool dynamic = 6;
}

// Hints claimed by the upstream server; the gateway does not enforce them.
message McpToolAnnotations {
  // Upstream claims the tool does not modify state.
  bool read_only = 1;
  // Upstream claims the tool can perform destructive updates; unset when the upstream sent no hint, which MCP reads as true.
  optional bool destructive = 2;
  // Upstream claims repeated calls with the same arguments have no extra effect.
  bool idempotent = 3;
  // Upstream claims the tool reaches systems outside its own domain; unset when the upstream sent no hint, which MCP reads as true.
  optional bool open_world = 4;
  // Display name the upstream sent in its annotations.
  string title = 5;
}

message McpIcon {
  // Icon URI, including HTTPS URLs and base64 data URIs.
  string src = 1 [(buf.validate.field).string.uri = true];
  // Optional MIME type override.
  string mime_type = 2;
  // Supported sizes such as "48x48" or "any".
  repeated string sizes = 3;
  // Optional background theme this icon was designed for.
  string theme = 4 [(buf.validate.field).string = {
    in: ["", "light", "dark"]
  }];
}

message McpTool {
  // Bare tool name as advertised by the upstream server.
  string name = 1;
  // Tool description advertised upstream, passed through to MCP clients.
  string description = 2;
  // JSON Schema for the tool arguments, as advertised upstream.
  google.protobuf.Struct input_schema = 3;
  // `ACTIVE`, or `MISSING` when the last sync no longer found the tool upstream.
  string status = 5;
  // Assigned once on first discovery and preserved across sync.
  string id = 6 [(openapi.v3.property) = {read_only: true}];
  // Human-readable label advertised upstream, when the server sends one.
  string title = 7;
  // Behaviour hints claimed by the upstream server.
  McpToolAnnotations annotations = 8;
  // OpenAPI operation the tool calls, for `MCP_CONNECTION_TYPE_OPENAPI` servers.
  McpHttpOperation http_operation = 9 [(openapi.v3.property) = {read_only: true}];
  // Icons advertised by the upstream tool.
  repeated McpIcon icons = 10;
  // JSON Schema for the tool's structured result, as advertised upstream; omitted when the upstream sent an invalid one.
  google.protobuf.Struct output_schema = 11;
  // Tool `_meta` advertised upstream.
  google.protobuf.Struct meta = 12;
}

// Capability families advertised by the upstream MCP server during discovery.
message McpServerCapabilities {
  bool tools = 1;
  bool resources = 2;
  bool prompts = 3;
  bool completions = 4;
}

// Upstream annotations shared by resource and resource template descriptors.
message McpResourceAnnotations {
  repeated string audience = 1;
  string last_modified = 2;
  double priority = 3;
}

message McpResource {
  string uri = 1;
  string name = 2;
  string title = 3;
  string description = 4;
  string mime_type = 5;
  int64 size = 6;
  McpResourceAnnotations annotations = 7;
  repeated McpIcon icons = 8;
  // Resource `_meta` advertised upstream.
  google.protobuf.Struct meta = 9;
  // Opaque selection ID scoped to this saved server and its upstream origin. Omitted on connection probes.
  optional string selection_id = 10 [(openapi.v3.property) = {read_only: true}];
}

message McpResourceTemplate {
  string uri_template = 1;
  string name = 2;
  string title = 3;
  string description = 4;
  string mime_type = 5;
  McpResourceAnnotations annotations = 6;
  repeated McpIcon icons = 7;
  // Resource template `_meta` advertised upstream.
  google.protobuf.Struct meta = 8;
  // Opaque ID for strict selection on a saved server. Omitted on probes and when template variables cannot be matched unambiguously.
  optional string selection_id = 9 [(openapi.v3.property) = {read_only: true}];
}

enum McpDiscoveryStatus {
  MCP_DISCOVERY_STATUS_UNSPECIFIED = 0;
  // All pages were read, including a successful empty list.
  MCP_DISCOVERY_STATUS_SYNCED = 1;
  // The upstream did not advertise the capability or implement the list method.
  MCP_DISCOVERY_STATUS_UNSUPPORTED = 2;
  // Listing failed. A persisted catalog can still contain the previous successful snapshot.
  MCP_DISCOVERY_STATUS_FAILED = 3;
}

message McpResourceCatalog {
  repeated McpResource resources = 1;
  repeated McpResourceTemplate resource_templates = 2;
  McpDiscoveryStatus resources_status = 3;
  McpDiscoveryStatus resource_templates_status = 4;
}

message McpHttpOperation {
  // HTTP method, upper case.
  string method = 1;
  // Path template relative to the server base URL.
  string path = 2;
}

message McpOpenApiConfig {
  // OpenAPI 3.x document as JSON or YAML; accepted on write and never stored or returned.
  string document = 1 [
    (buf.validate.field).string.max_bytes = 10485760,
    (openapi.v3.property) = {write_only: true}
  ];
  // URL the document is fetched from; `:sync` fetches it again.
  string document_url = 2 [(buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE, (buf.validate.field).string.uri = true];
  // Tool names of the operations to expose; empty exposes every operation.
  repeated string operations = 3;
  // `info.title` of the compiled document.
  string title = 4 [(openapi.v3.property) = {read_only: true}];
  // `info.version` of the compiled document.
  string version = 5 [(openapi.v3.property) = {read_only: true}];
}

message McpOpenApiPreview {
  // `info.title` of the document.
  string title = 1;
  // `info.version` of the document.
  string version = 2;
  // Absolute `servers` URLs declared by the document.
  repeated string server_urls = 3;
  // Operations left out of the tool list and why.
  repeated string warnings = 4;
}

message McpSyncState {
  enum SyncStatus {
    SYNC_STATUS_UNSPECIFIED = 0;
    SYNC_STATUS_SYNCED = 1;
    SYNC_STATUS_FAILED = 2;
    SYNC_STATUS_PENDING = 3;
  }
  // Outcome of the last sync; a sync that discovers zero tools still reports SYNCED.
  SyncStatus status = 1;
  // Tools in the catalog after the last sync.
  int32 tools_total = 2;
  // Tools the last sync discovered for the first time.
  int32 tools_added = 3;
  // Tools the last sync no longer found upstream and marked MISSING.
  int32 tools_removed = 4;
  // ISO 8601 timestamp of the last sync attempt.
  string last_synced_at = 5;
  // Failures reported by the last sync.
  repeated string errors = 6;
  // Skills in the catalog after the last sync.
  int32 skills_total = 7;
}

message McpGatewayServerLink {
  option (openapi.v3.schema) = {
    required: [
      "mcp_server_id",
      "alias",
      "tool_exposure"
    ]
  };

  // Upstream MCP server this gateway aggregates.
  string mcp_server_id = 1 [(buf.validate.field).string.min_len = 1];
  // Prefix used instead of the server key when namespacing this server's tool names. Must be unique within the gateway.
  string alias = 2;
  // Whether this link contributes tools to the gateway.
  bool enabled = 3;
  // Narrows which of the server's tools this gateway exposes.
  McpToolExposure tool_exposure = 4;
  // Which of the server's skills this gateway serves. Unset serves none.
  McpSkillExposure skill_exposure = 5;
  // Which upstream resources and templates this gateway exposes. Omission preserves an existing link's selection and exposes none on a new link.
  McpResourceExposure resource_exposure = 6;
}

message McpRuntimeLimits {
  int32 request_timeout_ms = 1;
  int32 tool_timeout_ms = 2;
  int32 max_request_bytes = 3;
  int32 max_response_bytes = 4;
  int32 max_tools_per_gateway = 5;
  int32 per_token_requests_per_minute = 6;
  int32 per_gateway_requests_per_minute = 7;
}

message McpGatewayPlugin {
  string id = 1 [
    (buf.validate.field).string = {
      in: [
        "pii_redaction",
        "trace_scrubbing"
      ]
    },
    (openapi.v3.property) = {description: "Plugin discriminator."}
  ];
  optional string language = 2 [(buf.validate.field).string = {
    in: [
      "",
      "en",
      "nl"
    ]
  }];
  repeated string entities = 3;
  optional string on_failure = 4 [(buf.validate.field).string = {
    in: [
      "",
      "block",
      "passthrough"
    ]
  }];
  optional double threshold = 5 [(buf.validate.field).double = {
    gte: 0
    lte: 1
  }];
  repeated string mask = 6;
  repeated string regions = 7 [(openapi.v3.property) = {description: "Regions of coverage by ISO 3166-1 alpha-2 code, or [\"all\"]. Combines with entities: the two selections are unioned."}];
  map<string, double> entity_thresholds = 8 [
    (buf.validate.field).map.values.double = {
      gte: 0
      lte: 1
    },
    (openapi.v3.property) = {description: "Per-entity-type confidence cutoff. Every key must also appear in entities."}
  ];
}

message McpTestResult {
  // Whether the connection probe succeeded, including listing tools when advertised.
  bool ok = 1;
  // Tools discovered during the probe; not persisted.
  repeated McpTool tools = 2;
  // Round trip time of the probe in milliseconds.
  int32 latency_ms = 3;
  // Human-readable reason the probe failed.
  string error_message = 4;
  // Additional failure details collected during the probe.
  repeated string errors = 5;
  // Document details when probing an OpenAPI server.
  McpOpenApiPreview openapi = 6;
  // Capabilities advertised during this probe.
  McpServerCapabilities capabilities = 7;
  // Resource and resource template discovery results from this probe.
  McpResourceCatalog resource_catalog = 8;
}

message McpGatewayTool {
  // Key of the upstream server the tool comes from.
  string server_key = 1;
  // Alias configured on the gateway link the tool comes from.
  string alias = 2;
  // Name MCP clients call; namespaced per the gateway's `tool_naming` and capped at 64 characters.
  string exposed_name = 3;
  // Tool description advertised upstream, passed through to MCP clients.
  string description = 4;
  // JSON Schema for the tool arguments, as advertised upstream.
  google.protobuf.Struct input_schema = 5;
  // Upstream server the exposed tool resolves to.
  string mcp_server_id = 7;
  // Bare tool name on the upstream server, before namespacing.
  string upstream_tool_name = 8;
  // Human-readable label advertised upstream, when the server sends one.
  string title = 9;
  // Behaviour hints claimed by the upstream server.
  McpToolAnnotations annotations = 10;
  // Icons advertised by the upstream tool.
  repeated McpIcon icons = 11;
}

message McpGatewayToolTestResult {
  // Whether the tool call completed successfully.
  bool ok = 1;
  // Payload returned by the upstream tool.
  google.protobuf.Struct result = 2;
  // Round trip time of the tool call in milliseconds.
  int32 latency_ms = 3;
  // Human-readable reason the call failed.
  string error_message = 4;
  // Additional failure details collected during the call.
  repeated string errors = 5;
}

// ============================================================================
// McpServer entity and CRUD messages
// ============================================================================

message McpServer {
  // Unique identifier of the MCP server.
  string id = 1 [json_name = "_id"];
  // Lowercase slug of letters, digits, hyphens and underscores, max 64 characters, unique per workspace; prefixes this server's tool names in gateways.
  string key = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  // Human readable name shown in the workspace.
  string display_name = 3;
  // Free-form note about what this server is for.
  string description = 4;
  string workspace_id = 5 [(openapi.v3.property) = {
    specification_extension: [
      {
        name: "x-orq-hidden"
        value: {yaml: "true"}
      },
      {
        name: "x-speakeasy-ignore"
        value: {yaml: "true"}
      }
    ]
  }];
  // How the gateway dials the upstream server.
  McpConnection connection = 7;
  // Credentials the gateway sends upstream; send `type: NONE` explicitly for public servers.
  McpAuthConfig auth = 8;
  // Fallback exposure used by any gateway link that does not set its own.
  McpToolExposure default_tool_exposure = 9;
  // Result of the last `:sync`; a new server has no tools until synced.
  McpSyncState sync_state = 11;
  // Tool catalog discovered by the last successful `:sync`.
  repeated McpTool tools = 12;
  // ISO 8601 timestamp of when the server was created.
  string created = 13;
  // ISO 8601 timestamp of the most recent change to the server.
  string updated = 14;
  // Which projects in the workspace may use this server.
  Sharing sharing = 15;
  // Names of `{{variable}}` placeholders found in the connection or auth config; supply values as `discovery_variables` on test, sync and tool calls.
  repeated string template_variables = 16 [(openapi.v3.property) = {
    read_only: true
    specification_extension: [
      {
        name: "x-speakeasy-ignore"
        value: {yaml: "true"}
      }
    ]
  }];
  // Account that created the server.
  string created_by_id = 17 [(openapi.v3.property) = {read_only: true}];
  // Skills the upstream publishes through the MCP Skills extension, discovered by the last successful `:sync`.
  repeated McpSkill skills = 18 [(openapi.v3.property) = {read_only: true}];
  // Source of the tools of an `MCP_CONNECTION_TYPE_OPENAPI` server.
  McpOpenApiConfig openapi = 19;
  // Icons advertised by the upstream server during discovery.
  repeated McpIcon icons = 20 [(openapi.v3.property) = {read_only: true}];
  // Website advertised by the upstream server during discovery.
  string website_url = 21 [(openapi.v3.property) = {read_only: true}];
  // Capabilities from shared MCP discovery or the caller's current sync.
  McpServerCapabilities capabilities = 22 [(openapi.v3.property) = {read_only: true}];
  // Get returns the shared catalog. Sync returns the caller's catalog for user-specific credentials or discovery variables. List omits this field.
  McpResourceCatalog resource_catalog = 23 [(openapi.v3.property) = {read_only: true}];
}

message CreateMcpServerRequest {
  option (openapi.v3.schema) = {
    required: [
      "key",
      "display_name",
      "connection",
      "auth",
      "default_tool_exposure"
    ]
  };

  // Lowercase slug of letters, digits, hyphens and underscores, max 64 characters, unique per workspace; prefixes this server's tool names in gateways.
  string key = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 64
  ];
  // Human readable name shown in the workspace.
  string display_name = 2 [(buf.validate.field).string.min_len = 1];
  // Free-form note about what this server is for.
  optional string description = 3;
  // How the gateway dials the upstream server.
  McpConnection connection = 5;
  // Credentials the gateway sends upstream; send `type: NONE` explicitly for public servers.
  McpAuthConfig auth = 6;
  // Fallback exposure used by any gateway link that does not set its own.
  McpToolExposure default_tool_exposure = 7;
  // Which projects in the workspace may use this server. Defaults to every project.
  optional Sharing sharing = 8;
  // Required when `connection.type` is `MCP_CONNECTION_TYPE_OPENAPI`; set `document` or `document_url`.
  McpOpenApiConfig openapi = 9;
}

message CreateMcpServerResponse {
  McpServer mcp_server = 1;
}

message ListMcpServersRequest {
  // Page size between 1 and 200. Defaults to 25.
  optional int32 limit = 1 [
    (buf.validate.field).int32.gte = 1,
    (buf.validate.field).int32.lte = 200
  ];
  // Cursor for the page after the given item id. Mutually exclusive with `ending_before`.
  string starting_after = 2;
  // Cursor for the page before the given item id. Mutually exclusive with `starting_after`.
  string ending_before = 3;
  // Case-insensitive match against the server key and display name.
  string search = 4;
  // Spans every project the caller belongs to instead of the active one.
  bool all_accessible_projects = 5 [(openapi.v3.property) = {
    specification_extension: [
      {name: "x-orq-hidden" value: {yaml: "true"}},
      {name: "x-speakeasy-ignore" value: {yaml: "true"}}
    ]
  }];
}

message ListMcpServersResponse {
  // Always "list".
  string object = 1;
  // MCP servers on the current page.
  repeated McpServer data = 2;
  // Whether further items exist beyond this page.
  bool has_more = 3;
}

message GetMcpServerRequest {
  option (openapi.v3.schema) = {
    required: ["id"]
  };

  // Unique identifier of the MCP server.
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

message GetMcpServerResponse {
  McpServer mcp_server = 1;
}

message CheckMcpServerExistsRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

message CheckMcpServerExistsResponse {}

message UpdateMcpServerRequest {
  option (openapi.v3.schema) = {
    required: ["id"]
  };

  // Unique identifier of the MCP server.
  string id = 1 [(buf.validate.field).string.min_len = 1];
  // Rejected with INVALID_ARGUMENT: the key prefixes this server's tools in
  // every gateway that exposes it, so it is immutable after creation. Retained
  // so callers get an error rather than a silently ignored field.
  optional string key = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 64,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
  // Human readable name shown in the workspace.
  optional string display_name = 3;
  // Free-form note about what this server is for.
  optional string description = 4;
  // How the gateway dials the upstream server.
  optional McpConnection connection = 5;
  // Credentials the gateway sends upstream; send `type: NONE` explicitly for public servers.
  optional McpAuthConfig auth = 6;
  // Fallback exposure used by any gateway link that does not set its own.
  optional McpToolExposure default_tool_exposure = 7;
  // Which projects in the workspace may use this server. Defaults to every project.
  optional Sharing sharing = 9;
  // Recompiles the tools of an OpenAPI server; without `document` the stored `document_url` is fetched again.
  optional McpOpenApiConfig openapi = 10;
}

message UpdateMcpServerResponse {
  McpServer mcp_server = 1;
}

message DeleteMcpServerRequest {
  option (openapi.v3.schema) = {
    required: ["id"]
  };

  // Unique identifier of the MCP server.
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

// The response body is empty when the delete succeeds.
message DeleteMcpServerResponse {}

message CheckMcpServerKeyAvailabilityRequest {
  option (openapi.v3.schema) = {
    required: ["key"]
  };

  // Key to validate against the workspace's uniqueness rule.
  string key = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 64,
    (buf.validate.field).string.pattern = "^[a-z0-9]+(?:[-_][a-z0-9]+)*$"
  ];

  // Server to exclude from the check. Set when renaming so the server's own
  // key does not conflict with itself; leave empty when creating.
  string mcp_server_id = 3;
}

message CheckMcpServerKeyAvailabilityResponse {
  option (openapi.v3.schema) = {
    required: ["available"]
  };

  // Whether the key is available within the project.
  bool available = 1;
  // ID of the server currently using this key. Empty when `available` is true.
  string conflicting_mcp_server_id = 2;
}

message DuplicateMcpServerRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
  // Defaults to a derived, unused key in the source server's project.
  optional string key = 2;
  // Defaults to the source display name suffixed with "(copy)".
  optional string display_name = 3;
}

message DuplicateMcpServerResponse {
  McpServer mcp_server = 1;
}

message TestMcpServerRequest {
  // Connection to probe. Omit when `id` is set.
  McpConnection connection = 1;
  // Credentials to probe with. Omit when `id` is set.
  McpAuthConfig auth = 2;
  // Probe a stored server instead of sending `connection` and `auth`.
  string id = 3;
  // Values for the server's `template_variables`; treated as sensitive and not persisted.
  map<string, string> discovery_variables = 4;
  // Document to compile when probing an OpenAPI server.
  McpOpenApiConfig openapi = 5;
}

message TestMcpServerResponse {
  McpTestResult result = 1;
}

message SyncMcpServerRequest {
  option (openapi.v3.schema) = {
    required: ["id"]
  };

  // Unique identifier of the MCP server.
  string id = 1 [(buf.validate.field).string.min_len = 1];
  // Values for the server's `template_variables`; treated as sensitive and not persisted.
  map<string, string> discovery_variables = 2;
}

message SyncMcpServerResponse {
  McpServer mcp_server = 1;
}

message TestMcpServerToolRequest {
  option (openapi.v3.schema) = {
    required: [
      "id",
      "tool_name"
    ]
  };

  // Unique identifier of the MCP server.
  string id = 1 [(buf.validate.field).string.min_len = 1];
  // Bare upstream tool name, not a gateway's namespaced `exposed_name`.
  string tool_name = 2 [(buf.validate.field).string.min_len = 1];
  // Arguments passed to the tool, matching its `input_schema`.
  google.protobuf.Struct arguments = 3;
  // Values for the server's `template_variables`; treated as sensitive and not persisted.
  map<string, string> discovery_variables = 4;
}

message TestMcpServerToolResponse {
  McpGatewayToolTestResult result = 1;
}

message ReadMcpServerSkillRequest {
  option (openapi.v3.schema) = {
    required: [
      "id",
      "uri"
    ]
  };

  // Unique identifier of the MCP server.
  string id = 1 [(buf.validate.field).string.min_len = 1];
  // Resource URI of the file: a synced skill's `SKILL.md`, a file in its manifest, or a file under a dynamic skill.
  string uri = 2 [(buf.validate.field).string.min_len = 1];
  // Values for the server's `template_variables`; treated as sensitive and not persisted.
  map<string, string> discovery_variables = 3;
}

message ReadMcpServerSkillResponse {
  // Text of the file as published upstream; empty when it is binary or too large to preview.
  string content = 1;
  // MIME type reported by the upstream MCP server.
  string mime_type = 2;
  // Length in bytes of the file's content.
  int64 size = 3;
  // The file has binary content, which is not returned.
  bool binary = 4;
  // The file is larger than the preview limit, so its content is not returned.
  bool too_large = 5;
}

message ListMcpServerSkillFilesRequest {
  option (openapi.v3.schema) = {
    required: [
      "id",
      "uri"
    ]
  };

  // Unique identifier of the MCP server.
  string id = 1 [(buf.validate.field).string.min_len = 1];
  // `McpSkill.uri` of a skill from the server's last sync.
  string uri = 2 [(buf.validate.field).string.min_len = 1];
  // Values for the server's `template_variables`; treated as sensitive and not persisted.
  map<string, string> discovery_variables = 3;
}

message ListMcpServerSkillFilesResponse {
  // Files of the skill, its `SKILL.md` included.
  repeated McpSkillFile files = 1;
}

// ============================================================================
// McpGateway entity and CRUD messages
// ============================================================================

message McpGateway {
  // Unique identifier of the MCP gateway.
  string id = 1 [json_name = "_id"];
  // Lowercase slug of letters, digits, hyphens and underscores, max 64 characters, unique per workspace; backs the gateway's public MCP URL.
  string key = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  // Human readable name shown in the workspace.
  string display_name = 3;
  // Free-form note about what this gateway is for.
  string description = 4;
  string workspace_id = 5 [(openapi.v3.property) = {
    specification_extension: [
      {
        name: "x-orq-hidden"
        value: {yaml: "true"}
      },
      {
        name: "x-speakeasy-ignore"
        value: {yaml: "true"}
      }
    ]
  }];
  // Upstream servers this gateway aggregates.
  repeated McpGatewayServerLink server_links = 7;
  // How upstream tool names are namespaced before they are exposed.
  McpToolNaming tool_naming = 8;
  McpRuntimeLimits runtime_limits = 9 [(openapi.v3.property) = {
    specification_extension: [
      {
        name: "x-orq-hidden"
        value: {yaml: "true"}
      },
      {
        name: "x-speakeasy-ignore"
        value: {yaml: "true"}
      }
    ]
  }];
  reserved 10;
  reserved "egress_policy";
  // Endpoint MCP clients connect to; relative when the deployment has no public base URL configured.
  string public_url = 12;
  // ISO 8601 timestamp of when the gateway was created.
  string created = 13;
  // ISO 8601 timestamp of the most recent change to the gateway.
  string updated = 14;
  // Number of tools currently exposed across all enabled links.
  int32 exposed_tools_count = 15;
  // Shape of the tool surface presented to MCP clients: CODE or DIRECT.
  McpGatewayMode mode = 16;
  // Which projects in the workspace may use this gateway.
  Sharing sharing = 17;
  // Plugins run on every tool call this gateway serves.
  repeated McpGatewayPlugin plugins = 18;
  // Workspace skills this gateway serves to MCP clients through the MCP Skills extension.
  repeated string skill_ids = 19;
  // Icons advertised to MCP clients; defaults to ORQ branding when empty.
  repeated McpIcon icons = 20;
  // Website advertised to MCP clients; defaults to ORQ documentation when empty.
  string website_url = 21;
  // Guardrails run on the arguments and result of every tool call this gateway serves.
  repeated GuardrailRuleGuardrail guardrails = 22;
  // Account that created the gateway.
  string created_by_id = 23 [(openapi.v3.property) = {read_only: true}];

  reserved 11;
  reserved "status";
}

message CreateMcpGatewayRequest {
  option (openapi.v3.schema) = {
    required: [
      "key",
      "display_name"
    ]
  };

  // Lowercase slug of letters, digits, hyphens and underscores, max 64 characters, unique per workspace; backs the gateway's public MCP URL.
  string key = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 64
  ];
  // Human readable name shown in the workspace.
  string display_name = 2 [(buf.validate.field).string.min_len = 1];
  // Free-form note about what this gateway is for.
  optional string description = 3;
  // Upstream servers this gateway aggregates.
  repeated McpGatewayServerLink server_links = 5;
  // How upstream tool names are namespaced before they are exposed. Defaults to PREFIX_ON_COLLISION.
  McpToolNaming tool_naming = 6;
  McpRuntimeLimits runtime_limits = 7 [(openapi.v3.property) = {
    specification_extension: [
      {
        name: "x-orq-hidden"
        value: {yaml: "true"}
      },
      {
        name: "x-speakeasy-ignore"
        value: {yaml: "true"}
      }
    ]
  }];
  reserved 8;
  reserved "egress_policy";
  // Shape of the tool surface presented to MCP clients: CODE or DIRECT. Defaults to CODE.
  McpGatewayMode mode = 9;
  // Which projects in the workspace may use this gateway. Defaults to every project.
  optional Sharing sharing = 10;
  // Plugins run on every tool call this gateway serves.
  repeated McpGatewayPlugin plugins = 11;
  // Workspace skills this gateway serves to MCP clients through the MCP Skills extension.
  repeated string skill_ids = 12;
  // Icons advertised to MCP clients; defaults to ORQ branding when empty.
  repeated McpIcon icons = 13;
  // Website advertised to MCP clients; defaults to ORQ documentation when empty.
  string website_url = 14 [(buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE, (buf.validate.field).string.uri = true];
  // Guardrails run on the arguments and result of every tool call this gateway serves.
  repeated GuardrailRuleGuardrail guardrails = 15;
}

message CreateMcpGatewayResponse {
  McpGateway mcp_gateway = 1;
}

message ListMcpGatewaysRequest {
  // Page size between 1 and 200. Defaults to 25.
  optional int32 limit = 1 [
    (buf.validate.field).int32.gte = 1,
    (buf.validate.field).int32.lte = 200
  ];
  // Cursor for the page after the given item id. Mutually exclusive with `ending_before`.
  string starting_after = 2;
  // Cursor for the page before the given item id. Mutually exclusive with `starting_after`.
  string ending_before = 3;
  // Case-insensitive match against the gateway key and display name.
  string search = 4;

  reserved 5;
  reserved "status";
  // Spans every project the caller belongs to instead of the active one.
  bool all_accessible_projects = 6 [(openapi.v3.property) = {
    specification_extension: [
      {name: "x-orq-hidden" value: {yaml: "true"}},
      {name: "x-speakeasy-ignore" value: {yaml: "true"}}
    ]
  }];
}

message ListMcpGatewaysResponse {
  // Always "list".
  string object = 1;
  // MCP gateways on the current page.
  repeated McpGateway data = 2;
  // Whether further items exist beyond this page.
  bool has_more = 3;
}

message GetMcpGatewayRequest {
  option (openapi.v3.schema) = {
    required: ["id"]
  };

  // Unique identifier of the MCP gateway.
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

message GetMcpGatewayResponse {
  McpGateway mcp_gateway = 1;
}

message CheckMcpGatewayExistsRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

message CheckMcpGatewayExistsResponse {}

message CheckMcpGatewayKeyAvailabilityRequest {
  // Key to validate against the workspace's uniqueness rule.
  string key = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 64,
    (buf.validate.field).string.pattern = "^[a-z0-9]+(?:[-_][a-z0-9]+)*$"
  ];
}

message CheckMcpGatewayKeyAvailabilityResponse {
  // Whether the key is available within the workspace.
  bool available = 1;
}

message UpdateMcpGatewayRequest {
  option (openapi.v3.schema) = {
    required: ["id"]
  };

  // Unique identifier of the MCP gateway.
  string id = 1 [(buf.validate.field).string.min_len = 1];
  // Rejected with INVALID_ARGUMENT: the key backs the gateway's public MCP URL
  // and is immutable after creation. Retained so callers get an error rather
  // than a silently ignored field.
  optional string key = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 64,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
  // Human readable name shown in the workspace.
  optional string display_name = 3;
  // Free-form note about what this gateway is for.
  optional string description = 4;
  // Replaces the current links. An empty array is treated as no change; use `clear_server_links` to remove them all.
  repeated McpGatewayServerLink server_links = 5;
  // How upstream tool names are namespaced before they are exposed.
  optional McpToolNaming tool_naming = 6;
  optional McpRuntimeLimits runtime_limits = 7 [(openapi.v3.property) = {
    specification_extension: [
      {
        name: "x-orq-hidden"
        value: {yaml: "true"}
      },
      {
        name: "x-speakeasy-ignore"
        value: {yaml: "true"}
      }
    ]
  }];
  reserved 8;
  reserved "egress_policy";
  // Shape of the tool surface presented to MCP clients: CODE or DIRECT.
  optional McpGatewayMode mode = 10;
  // Which projects in the workspace may use this gateway. Defaults to every project.
  optional Sharing sharing = 11;
  // Set true to remove every link; cannot be combined with `server_links`.
  bool clear_server_links = 12;
  // Plugins run on every tool call this gateway serves.
  repeated McpGatewayPlugin plugins = 13;

  // Connect clients set this when replacing plugins, including with an empty
  // list. It is hidden from the public REST/SDK surface, where an explicit
  // `plugins: []` remains the compatibility signal for clearing plugins.
  optional bool replace_plugins = 14 [(openapi.v3.property) = {
    specification_extension: [
      {
        name: "x-orq-hidden"
        value: {yaml: "true"}
      },
      {
        name: "x-speakeasy-ignore"
        value: {yaml: "true"}
      }
    ]
  }];
  // Replaces the served workspace skills. An empty array is treated as no change; use `clear_skill_ids` to remove them all.
  repeated string skill_ids = 15;
  // Set true to stop serving every workspace skill; cannot be combined with `skill_ids`.
  bool clear_skill_ids = 16;
  // Replaces the advertised icons when nonempty or when replace_icons is true.
  repeated McpIcon icons = 17;
  // Set true with an empty icons list to restore default ORQ branding.
  bool replace_icons = 18;
  // Empty restores the default ORQ documentation website.
  optional string website_url = 19 [(buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE, (buf.validate.field).string.uri = true];
  // Guardrails run on the arguments and result of every tool call this gateway serves.
  repeated GuardrailRuleGuardrail guardrails = 20;

  // Hidden like replace_plugins: REST clears with an explicit `guardrails: []`.
  optional bool replace_guardrails = 21 [(openapi.v3.property) = {
    specification_extension: [
      {
        name: "x-orq-hidden"
        value: {yaml: "true"}
      },
      {
        name: "x-speakeasy-ignore"
        value: {yaml: "true"}
      }
    ]
  }];
  // Latest observed `McpGateway.updated` value. Required when changing resource exposure or re-enabling a link that exposes resources.
  optional string expected_updated = 22;

  reserved 9;
  reserved "status";
}

message UpdateMcpGatewayResponse {
  McpGateway mcp_gateway = 1;
}

message DeleteMcpGatewayRequest {
  option (openapi.v3.schema) = {
    required: ["id"]
  };

  // Unique identifier of the MCP gateway.
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

// The response body is empty when the delete succeeds.
message DeleteMcpGatewayResponse {}

