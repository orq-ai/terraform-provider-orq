  // Whether further items exist beyond this page.
  bool has_more = 3;
}

// ============================================================================
// McpGatewayClient entity and messages
// ============================================================================

// McpGatewayClient is one MCP client's OAuth grant on one gateway. The grant
// outlives any single connection: it stands until revoked or until its refresh
// token expires.
message McpGatewayClient {
  string id = 1 [json_name = "_id"];
  string mcp_gateway_id = 2;
  string client_id = 3;
  string client_name = 4;
  string authorized_by = 5;
  string created_by_id = 9;
  repeated string scope = 6;
  string authorized_at = 7;
  string project_id = 10;
}

message ListMcpGatewayClientsRequest {
  string mcp_gateway_id = 1 [(buf.validate.field).string.min_len = 1];
  optional int32 limit = 2 [
    (buf.validate.field).int32.gte = 1,
    (buf.validate.field).int32.lte = 200
  ];
  string starting_after = 3;
  string ending_before = 4;
  string search = 5;
}

message ListMcpGatewayClientsResponse {
  string object = 1;
  repeated McpGatewayClient data = 2;
  bool has_more = 3;
}

message RevokeMcpGatewayClientRequest {
  string mcp_gateway_id = 1 [(buf.validate.field).string.min_len = 1];
  string id = 2 [(buf.validate.field).string.min_len = 1];
}

message RevokeMcpGatewayClientResponse {
  McpGatewayClient mcp_gateway_client = 1;
}
