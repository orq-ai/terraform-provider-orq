syntax = "proto3";

package orq.platform.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "openapiv3/annotations.proto";
import "orq/authz/v1/authz.proto";

option (openapi.v3.document) = {
  tags: [
    {
      name: "Secrets"
      description: "Write-only secrets stored in vaults and exposed to factory work items as environment variables."
    }
  ]
};

// Secret values are write-only: no RPC ever returns them. Reads return
// metadata only. Access follows the vault: whoever can view or update the
// vault can view or manage its secrets.
service SecretsService {
  rpc CreateSecret(CreateSecretRequest) returns (CreateSecretResponse) {
    option (orq.authz.v1.authz) = {
      verb: "secret.create"
      scope: AUTHZ_SCOPE_WORKSPACE
    };
    option (google.api.http) = {
      post: "/v2/vaults/{vault_id}/secrets"
      body: "*"
    };
    option (openapi.v3.operation) = {
      summary: "Create a secret"
      description: "Adds a secret to a vault. The name is unique within the vault and immutable; the value is never returned. Names starting with `ORQ_` are reserved for platform credentials and rejected."
      operation_id: "SecretCreate"
      tags: ["Secrets", "private"]
      specification_extension: [
        {name: "x-speakeasy-group" value: {yaml: "secrets"}},
        {name: "x-speakeasy-name-override" value: {yaml: "create"}},
        {name: "x-cli-hidden" value: {yaml: "true"}},
        {name: "x-speakeasy-ignore" value: {yaml: "true"}}
      ]
    };
  }

  rpc ListSecrets(ListSecretsRequest) returns (ListSecretsResponse) {
    option (orq.authz.v1.authz) = {
      verb: "secret.list"
      scope: AUTHZ_SCOPE_WORKSPACE
    };
    option (google.api.http) = {get: "/v2/vaults/{vault_id}/secrets"};
    option (openapi.v3.operation) = {
      summary: "List secrets"
      description: "Returns the metadata of every secret in a vault, without values."
      operation_id: "SecretList"
      tags: ["Secrets", "private"]
      specification_extension: [
        {name: "x-speakeasy-group" value: {yaml: "secrets"}},
        {name: "x-speakeasy-name-override" value: {yaml: "list"}},
        {name: "x-cli-hidden" value: {yaml: "true"}},
        {name: "x-speakeasy-ignore" value: {yaml: "true"}}
      ]
    };
  }

  rpc GetSecret(GetSecretRequest) returns (GetSecretResponse) {
    option (orq.authz.v1.authz) = {
      verb: "secret.view"
      scope: AUTHZ_SCOPE_WORKSPACE
    };
    option (google.api.http) = {get: "/v2/vaults/{vault_id}/secrets/{secret_id}"};
    option (openapi.v3.operation) = {
      summary: "Get a secret"
      description: "Retrieves the metadata of one secret, without its value."
      operation_id: "SecretGet"
      tags: ["Secrets", "private"]
      specification_extension: [
        {name: "x-speakeasy-group" value: {yaml: "secrets"}},
        {name: "x-speakeasy-name-override" value: {yaml: "get"}},
        {name: "x-cli-hidden" value: {yaml: "true"}},
        {name: "x-speakeasy-ignore" value: {yaml: "true"}}
      ]
    };
  }

  rpc UpdateSecret(UpdateSecretRequest) returns (UpdateSecretResponse) {
    option (orq.authz.v1.authz) = {
      verb: "secret.update"
      scope: AUTHZ_SCOPE_WORKSPACE
    };
    option (google.api.http) = {
      patch: "/v2/vaults/{vault_id}/secrets/{secret_id}"
      body: "*"
    };
    option (openapi.v3.operation) = {
      summary: "Update a secret"
      description: "Rotates the value or changes the kind or description of a secret. A new value reaches running work items on their next credential refresh."
      operation_id: "SecretUpdate"
      tags: ["Secrets", "private"]
      specification_extension: [
        {name: "x-speakeasy-group" value: {yaml: "secrets"}},
        {name: "x-speakeasy-name-override" value: {yaml: "update"}},
        {name: "x-cli-hidden" value: {yaml: "true"}},
        {name: "x-speakeasy-ignore" value: {yaml: "true"}}
      ]
    };
  }

  rpc DeleteSecret(DeleteSecretRequest) returns (DeleteSecretResponse) {
    option (orq.authz.v1.authz) = {
      verb: "secret.delete"
      scope: AUTHZ_SCOPE_WORKSPACE
    };
    option (google.api.http) = {delete: "/v2/vaults/{vault_id}/secrets/{secret_id}"};
    option (openapi.v3.operation) = {
      summary: "Delete a secret"
      description: "Removes a secret from a vault."
      operation_id: "SecretDelete"
      tags: ["Secrets", "private"]
      specification_extension: [
        {name: "x-speakeasy-group" value: {yaml: "secrets"}},
        {name: "x-speakeasy-name-override" value: {yaml: "delete"}},
        {name: "x-cli-hidden" value: {yaml: "true"}},
        {name: "x-speakeasy-ignore" value: {yaml: "true"}}
      ]
    };
  }

  rpc ListFactorySecrets(ListFactorySecretsRequest) returns (ListFactorySecretsResponse) {
    option (orq.authz.v1.authz) = {
      verb: "secret.list"
      scope: AUTHZ_SCOPE_WORKSPACE
    };
    option (google.api.http) = {get: "/v2/vaults/factories/{factory_id}/secrets"};
    option (openapi.v3.operation) = {
      summary: "List effective factory secrets"
      description: "Resolves the vaults attached to a factory into the environment a work item receives: one entry per name, the winning vault by attachment order, and the vaults it shadows. Values are never included."
      operation_id: "FactorySecretList"
      tags: ["Secrets", "private"]
      specification_extension: [
        {name: "x-speakeasy-group" value: {yaml: "secrets"}},
        {name: "x-speakeasy-name-override" value: {yaml: "listForFactory"}},
        {name: "x-cli-hidden" value: {yaml: "true"}},
        {name: "x-speakeasy-ignore" value: {yaml: "true"}}
      ]
    };
  }
}

enum SecretKind {
  SECRET_KIND_UNSPECIFIED = 0;
  // Plain configuration: present in the setup and agent shells, not redacted.
  SECRET_KIND_VARIABLE = 1;
  // Present in the setup and agent shells; redacted from events, transcripts, commits and pushes.
  SECRET_KIND_SECRET = 2;
  // Present only while blueprint setup and maintenance run; removed before the agent shell starts.
  SECRET_KIND_SETUP_SECRET = 3;
}

message Secret {
  option (openapi.v3.schema) = {
    required: [
      "id",
      "vault_id",
      "name",
      "kind",
      "created_by_id",
      "created",
      "updated"
    ]
  };

  string id = 1 [
    json_name = "_id",
    (openapi.v3.property) = {example: {yaml: "sec_01K8EXAMPLESECRET000000000"}}
  ];
  string vault_id = 2;
  // Environment variable name the work item sees.
  string name = 3;
  SecretKind kind = 4;
  string description = 5;
  string created_by_id = 6;
  string updated_by_id = 7;
  google.protobuf.Timestamp created = 8;
  google.protobuf.Timestamp updated = 9;
  // Last time a work item received this secret. Unset until first use.
  google.protobuf.Timestamp last_used_at = 10;
}

// One environment variable a work item in the factory receives.
message FactorySecret {
  option (openapi.v3.schema) = {
    required: [
      "name",
      "kind",
      "vault_id",
      "secret_id"
    ]
  };

  string name = 1;
  SecretKind kind = 2;
  // Attached vault that supplies the value: the first attached vault defining the name.
  string vault_id = 3;
  string secret_id = 4;
  // Attached vaults that also define the name but lose by attachment order.
  repeated string shadowed_vault_ids = 5;
}

message CreateSecretRequest {
  option (openapi.v3.schema) = {
    required: [
      "vault_id",
      "name",
      "kind",
      "value"
    ]
    example: {yaml: "{\"vault_id\":\"vault_01K8EXAMPLEVAULT000000000\",\"name\":\"STRIPE_API_KEY\",\"kind\":\"SECRET_KIND_SECRET\",\"value\":\"sk_test_example\",\"description\":\"Stripe test-mode key.\"}"}
  };

  string vault_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  // Uppercase environment variable name, unique within the vault, immutable.
  string name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
    pattern: "^[A-Z_][A-Z0-9_]*$"
  }];
  SecretKind kind = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  // Never returned by any RPC.
  string value = 4 [
    (buf.validate.field).string.max_bytes = 65536,
    (openapi.v3.property) = {write_only: true}
  ];
  string description = 5 [(buf.validate.field).string.max_len = 2000];
}

message CreateSecretResponse {
  Secret secret = 1;
}

message ListSecretsRequest {
  string vault_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
}

message ListSecretsResponse {
  // Always "list".
  string object = 1;
  // Sorted by name.
  repeated Secret data = 2;
}

message GetSecretRequest {
  string vault_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  string secret_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
}

message GetSecretResponse {
  Secret secret = 1;
}

message UpdateSecretRequest {
  option (openapi.v3.schema) = {
    required: [
      "vault_id",
      "secret_id"
    ]
  };

  string vault_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  string secret_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  optional SecretKind kind = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: 0
  }];
  // Replaces the stored value. Never returned by any RPC.
  optional string value = 4 [
    (buf.validate.field).string.max_bytes = 65536,
    (openapi.v3.property) = {write_only: true}
  ];
  optional string description = 5 [(buf.validate.field).string.max_len = 2000];
}

message UpdateSecretResponse {
  Secret secret = 1;
}

message DeleteSecretRequest {
  string vault_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  string secret_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
}

// The response body is empty when the delete succeeds.
message DeleteSecretResponse {}

message ListFactorySecretsRequest {
  string factory_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  // Resolve only these attached vaults, as a task carrying the same `vault_ids` would see it. Vaults not attached to the factory are ignored.
  repeated string vault_ids = 2 [(buf.validate.field).repeated = {
    max_items: 20
    unique: true
    items: {
      string: {
        min_len: 1
        max_len: 64
      }
    }
  }];
}

message ListFactorySecretsResponse {
  // Always "list".
  string object = 1;
  // Sorted by name.
  repeated FactorySecret data = 2;
}
