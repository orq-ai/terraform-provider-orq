syntax = "proto3";

package orq.platform.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "openapiv3/annotations.proto";
import "orq/authz/v1/authz.proto";
import "orq/platform/v1/sharing.proto";

option (openapi.v3.document) = {
  tags: [
    {
      name: "Environments"
      description: "Reusable workspace- and project-scoped deployment environments."
    }
  ]
};

service EnvironmentsService {
  rpc CreateEnvironment(CreateEnvironmentRequest) returns (CreateEnvironmentResponse) {
    option (orq.authz.v1.authz) = {
      verb: "environment.create"
      scope: AUTHZ_SCOPE_PROJECT
      project_id_field: "project_id"
    };
    option (google.api.http) = {
      post: "/v3/environments"
      body: "*"
    };
    option (openapi.v3.operation) = {
      summary: "Create an environment"
      description: "Creates either a project-owned environment or a workspace-owned environment with sharing. Exactly one scope must be provided."
      operation_id: "EnvironmentCreate"
      tags: ["Environments"]
      specification_extension: [
        {
          name: "x-speakeasy-group"
          value: {yaml: "environments"}
        },
        {
          name: "x-speakeasy-name-override"
          value: {yaml: "create"}
        },
        {
          name: "x-cli-group"
          value: {yaml: "environments"}
        },
        {
          name: "x-cli-name"
          value: {yaml: "create"}
        }
      ]
    };
  }

  rpc ListEnvironments(ListEnvironmentsRequest) returns (ListEnvironmentsResponse) {
    option (orq.authz.v1.authz) = {
      verb: "environment.list"
      scope: AUTHZ_SCOPE_PROJECT
      project_id_field: "project_id"
    };
    option (google.api.http) = {get: "/v3/environments"};
    option (openapi.v3.operation) = {
      summary: "List environments"
      description: "Returns environments visible to the caller. When project_id is set, the result contains project-owned environments plus workspace environments shared with that project. When project_id is omitted, the result contains workspace-owned environments."
      operation_id: "EnvironmentList"
      tags: ["Environments"]
      specification_extension: [
        {
          name: "x-speakeasy-group"
          value: {yaml: "environments"}
        },
        {
          name: "x-speakeasy-name-override"
          value: {yaml: "list"}
        },
        {
          name: "x-cli-group"
          value: {yaml: "environments"}
        },
        {
          name: "x-cli-name"
          value: {yaml: "list"}
        }
      ]
    };
  }

  rpc GetEnvironment(GetEnvironmentRequest) returns (GetEnvironmentResponse) {
    option (orq.authz.v1.authz) = {
      verb: "environment.view"
      scope: AUTHZ_SCOPE_PROJECT
    };
    option (google.api.http) = {get: "/v3/environments/{environment_id}"};
    option (openapi.v3.operation) = {
      summary: "Retrieve an environment"
      description: "Retrieves a visible environment by ID."
      operation_id: "EnvironmentGet"
      tags: ["Environments"]
      specification_extension: [
        {
          name: "x-speakeasy-group"
          value: {yaml: "environments"}
        },
        {
          name: "x-speakeasy-name-override"
          value: {yaml: "get"}
        },
        {
          name: "x-cli-group"
          value: {yaml: "environments"}
        },
        {
          name: "x-cli-name"
          value: {yaml: "get"}
        }
      ]
    };
  }

  rpc UpdateEnvironment(UpdateEnvironmentRequest) returns (UpdateEnvironmentResponse) {
    option (orq.authz.v1.authz) = {
      verb: "environment.update"
      scope: AUTHZ_SCOPE_PROJECT
    };
    option (google.api.http) = {
      patch: "/v3/environments/{environment_id}"
      body: "*"
    };
    option (openapi.v3.operation) = {
      summary: "Update an environment"
      description: "Updates environment metadata. Scope is immutable; sharing may only be updated on workspace-owned environments."
      operation_id: "EnvironmentUpdate"
      tags: ["Environments"]
      specification_extension: [
        {
          name: "x-speakeasy-group"
          value: {yaml: "environments"}
        },
        {
          name: "x-speakeasy-name-override"
          value: {yaml: "update"}
        },
        {
          name: "x-cli-group"
          value: {yaml: "environments"}
        },
        {
          name: "x-cli-name"
          value: {yaml: "update"}
        }
      ]
    };
  }

  rpc DeleteEnvironment(DeleteEnvironmentRequest) returns (DeleteEnvironmentResponse) {
    option (orq.authz.v1.authz) = {
      verb: "environment.delete"
      scope: AUTHZ_SCOPE_PROJECT
    };
    option (google.api.http) = {delete: "/v3/environments/{environment_id}"};
    option (openapi.v3.operation) = {
      summary: "Delete an environment"
      description: "Permanently deletes an environment."
      operation_id: "EnvironmentDelete"
      tags: ["Environments"]
      specification_extension: [
        {
          name: "x-speakeasy-group"
          value: {yaml: "environments"}
        },
        {
          name: "x-speakeasy-name-override"
          value: {yaml: "delete"}
        },
        {
          name: "x-cli-group"
          value: {yaml: "environments"}
        },
        {
          name: "x-cli-name"
          value: {yaml: "delete"}
        }
      ]
    };
  }
}

message Environment {
  option (openapi.v3.schema) = {
    required: [
      "id",
      "slug",
      "display_name",
      "description",
      "created_at",
      "created_by_id",
      "updated_at",
      "updated_by_id"
    ]
  };

  string id = 1 [
    json_name = "_id",
    (openapi.v3.property) = {description: "Unique environment ID in env_<ulid> form."}
  ];
  string slug = 2 [(openapi.v3.property) = {description: "Immutable environment slug, unique among the environments a project can see."}];
  string display_name = 3 [(openapi.v3.property) = {description: "Workspace-unique display name."}];
  string description = 4;
  google.protobuf.Timestamp created_at = 5;
  string created_by_id = 6;
  google.protobuf.Timestamp updated_at = 7;
  string updated_by_id = 8;

  oneof scope {
    string project_id = 9 [(openapi.v3.property) = {description: "Project that owns this environment."}];
    Sharing sharing = 10 [(openapi.v3.property) = {description: "Project access for a workspace-owned environment."}];
  }

  string workspace_id = 11 [(openapi.v3.property) = {
    specification_extension: [
      {
        name: "x-orq-hidden"
        value: {yaml: "true"}
      },
      {
        name: "x-speakeasy-ignore"
        value: {yaml: "true"}
      }
    ]
  }];
}

message CreateEnvironmentRequest {
  option (openapi.v3.schema) = {
    required: [
      "slug",
      "display_name"
    ]
  };
  option (buf.validate.message).cel = {
    id: "environment_scope_required"
    message: "exactly one of project_id or sharing is required"
    expression: "has(this.project_id) != has(this.sharing)"
  };

  string slug = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 64,
    (buf.validate.field).string.pattern = "^[a-z0-9]+(?:[-_][a-z0-9]+)*$"
  ];
  string display_name = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 255
  ];
  string description = 3 [(buf.validate.field).string.max_len = 1024];

  oneof scope {
    string project_id = 4 [(buf.validate.field).string.min_len = 1];
    Sharing sharing = 5;
  }
}

message CreateEnvironmentResponse {
  option (openapi.v3.schema) = {
    required: ["environment"]
  };
  Environment environment = 1;
}

message ListEnvironmentsRequest {
  optional int32 limit = 1 [
    (buf.validate.field).int32.gte = 1,
    (buf.validate.field).int32.lte = 200
  ];
  string starting_after = 2;
  string ending_before = 3;
  string project_id = 4;
  reserved 5;
  reserved "workspace_wide";
  optional string search = 6 [(buf.validate.field).string.max_len = 255];
}

message ListEnvironmentsResponse {
  option (openapi.v3.schema) = {
    required: [
      "object",
      "data",
      "has_more"
    ]
  };
  string object = 1;
  repeated Environment data = 2;
  bool has_more = 3;
}

message GetEnvironmentRequest {
  option (openapi.v3.schema) = {
    required: ["environment_id"]
  };
  string environment_id = 1 [(buf.validate.field).string.min_len = 1];
}

message GetEnvironmentResponse {
  option (openapi.v3.schema) = {
    required: ["environment"]
  };
  Environment environment = 1;
}

message UpdateEnvironmentRequest {
  option (buf.validate.message).cel = {
    id: "environment_update_not_empty"
    message: "at least one mutable field is required"
    expression: "has(this.display_name) || has(this.description) || has(this.sharing)"
  };
  option (openapi.v3.schema) = {
    required: ["environment_id"]
  };

  string environment_id = 1 [(buf.validate.field).string.min_len = 1];
  optional string display_name = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 255
  ];
  optional string description = 3 [(buf.validate.field).string.max_len = 1024];
  optional Sharing sharing = 4;
}

message UpdateEnvironmentResponse {
  option (openapi.v3.schema) = {
    required: ["environment"]
  };
  Environment environment = 1;
}

message DeleteEnvironmentRequest {
  option (openapi.v3.schema) = {
    required: ["environment_id"]
  };
  string environment_id = 1 [(buf.validate.field).string.min_len = 1];
}

message DeleteEnvironmentResponse {}
