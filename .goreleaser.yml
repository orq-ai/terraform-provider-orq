# goreleaser config for the orq Terraform provider.
#
# STATUS: UNUSED until first publish. The provider is local-development only
# right now (no GitHub upstream, no registry entry). This file is the standard
# terraform-provider release template kept ready so that, once
# orq-ai/terraform-provider-orq exists and a GPG signing key is configured, a
# tagged release (git tag vX.Y.Z) publishes to registry.terraform.io and the
# OpenTofu registry unchanged. Do not wire it into CI yet.
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
      - freebsd
    goarch:
      - amd64
      - arm64
      - "386"
    ignore:
      - goos: darwin
        goarch: "386"
    binary: "{{ .ProjectName }}_v{{ .Version }}"

archives:
  - formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_SHA256SUMS"
  algorithm: sha256

signs:
  - artifacts: checksum
    args:
      # Requires GPG_FINGERPRINT in the release environment.
      - "--batch"
      - "--local-user"
      - "{{ .Env.GPG_FINGERPRINT }}"
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"

release:
  # Registries ingest release assets from GitHub tags.
  draft: true

changelog:
  disable: true
