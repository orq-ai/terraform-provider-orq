# CI for terraform-provider-orq.
#
# Enforces that the generated trees are reproducible and never hand-edited:
# `make check-generated` regenerates both clients and `make docs` re-renders the
# registry documentation; either diff fails the build.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      # Pin the buf CLI so `make check-generated` compares against the exact
      # generator the codegen was committed with (the remote plugin versions are
      # pinned in buf.gen.yaml; the CLI version is pinned here).
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.69.0"

      - name: Verify generated code is reproducible
        run: make check-generated

      - name: Vet
        run: go vet ./...

      - name: Build
        run: make build

      - name: Test
        run: make test

      - name: Verify registry docs are up to date
        run: |
          make docs
          git add -N docs/
          git diff --exit-code -- docs/ \
            || { echo "docs are out of date; run 'make docs' and commit"; exit 1; }
